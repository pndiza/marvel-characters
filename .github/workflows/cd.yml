name: CD

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy (${{ matrix.environment }})
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}

    strategy:
      fail-fast: false
      matrix:
        environment: [acc, prd]

    permissions:
      contents: write # Allows the production tag to be pushed.

    env:
      DATABRICKS_AUTH_TYPE: oauth-m2m
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Databricks CLI
        uses: databricks/setup-cli@49580195afe1ccb06d195764a1d0ae9fabfe2edd # v0.246.0
        with:
          version: 0.296.1
      - name: Check Databricks CLI version
        shell: bash
        run: |
          command -v databricks
          databricks --version

      - name: Check Databricks credentials are available
        shell: bash
        run: |
          test -n "${DATABRICKS_HOST:-}" || { echo "::error::Missing DATABRICKS_HOST"; exit 1; }
          test -n "${DATABRICKS_CLIENT_ID:-}" || { echo "::error::Missing DATABRICKS_CLIENT_ID"; exit 1; }
          test -n "${DATABRICKS_CLIENT_SECRET:-}" || { echo "::error::Missing DATABRICKS_CLIENT_SECRET"; exit 1; }

      - name: Test Databricks authentication
        run: databricks current-user me

      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1

      - name: Validate Databricks bundle
        run: databricks bundle validate --target "${{ matrix.environment }}"

      - name: Deploy to Databricks
        shell: bash
        run: |
          set -euo pipefail

          databricks bundle deploy \
            --target "${{ matrix.environment }}" \
            --var="git_sha=${{ github.sha }}" \
            --var="branch=${{ github.ref_name }}"

          if [ "${{ matrix.environment }}" = "prd" ]; then
            VERSION="$(tr -d '\r\n' < version.txt)"
            echo "Creating release tag: $VERSION"
            git tag "$VERSION"
            git push origin "$VERSION"
          fi